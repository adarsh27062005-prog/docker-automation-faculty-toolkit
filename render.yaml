# Render Blueprint: runs this repo as the live Faculty Toolkit (real Docker Hub data).
# Render rebuilds and redeploys automatically on every push to `main`.
# Live link: https://amrita-faculty-toolkit.onrender.com
# Docs: https://render.com/docs/blueprint-spec
#
# Free plan: the server sleeps after 15 minutes without visitors and takes about a
# minute to wake. Rosters and scores live in memory, so a sleep or redeploy clears
# them; the exported Excel (Marks sheet) is the record.
services:
  - type: web
    name: amrita-faculty-toolkit
    runtime: python
    plan: free
    region: singapore            # closest Render region to India
    branch: main
    buildCommand: pip install -r requirements.txt
    # One process only: rosters, scores, jobs and the cache live in memory.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISPLAY_TZ
        value: Asia/Kolkata
      - key: SUBMISSION_DATE_BASIS
        value: last_push
      # Optional shared login: add BASIC_AUTH_USERNAME and BASIC_AUTH_PASSWORD in the
      # Render dashboard (Environment) to require a password. Never put them in this file.
